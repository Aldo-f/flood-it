<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tango</title>
    <link rel="stylesheet" href="../../shared/css/style.css">
    <style>
        .tango-container { width: 100%; max-width: 450px; }
        
        .tango-grid-container {
            background: #16213e;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        .tango-grid {
            display: grid;
            gap: 2px;
            margin: 0 auto;
        }
        
        .tango-cell {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a2744;
            border-radius: 4px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }
        
        .tango-cell:hover { background: #243354; }
        
        .tango-cell.fixed {
            background: #0f3460;
        }
        
        .tango-cell .constraint {
            position: absolute;
            font-size: 10px;
            color: #e94560;
            font-weight: bold;
        }
        
        .tango-cell .constraint.top { top: 2px; }
        .tango-cell .constraint.bottom { bottom: 2px; }
        .tango-cell .constraint.left { left: 2px; }
        .tango-cell .constraint.right { right: 2px; }
        
        .tango-info {
            text-align: center;
            margin: 15px 0;
            color: #888;
            font-size: 14px;
        }
        
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #aaa;
            font-size: 12px;
        }
        
        @media (max-width: 400px) {
            .tango-cell {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="lang-switch">
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn active" onclick="setLanguage('nl')">NL</button>
        </div>
        
        <h1>💃 Tango</h1>
        <p class="subtitle">Plaats zonnen en manen in elke rij en kolom</p>
        
        <div class="card">
            <button class="btn btn-primary" onclick="startDailyPuzzle()">
                🔥 Dagelijkse Puzzle
            </button>
            
            <button class="btn btn-secondary" onclick="startGame()" style="margin-top: 10px;">
                🎲 Willekeurig Spel
            </button>
        </div>
        
        <div class="legend">
            <div class="legend-item"><span>=</span> Zelfde</div>
            <div class="legend-item"><span>×</span> Anders</div>
        </div>
        
        <div class="tango-grid-container">
            <div class="tango-grid" id="tango-grid"></div>
        </div>
        
        <div class="tango-info">
            Elke rij en kolom moet 3 ☀️ en 3 🌙 bevatten
        </div>
        
        <div class="game-tools">
            <button class="tool-btn" onclick="undoMove()" id="undo-btn" disabled>↩ UNDO</button>
            <button class="tool-btn" onclick="clearBoard()">🗑️ CLEAR</button>
        </div>
        
        <button class="btn btn-secondary" onclick="goToDashboard()">← Terug naar Spellen</button>
    </div>

    <script src="js/tango.js"></script>
    <script>
        let game = null;
        let grid = [];
        let history = [];
        let currentLang = localStorage.getItem('games_lang') || 'nl';
        
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('games_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
            });
            
            const texts = {
                en: { subtitle: 'Place suns and moons in each row and column', daily: 'Daily Puzzle', random: 'Random Game' },
                nl: { subtitle: 'Plaats zonnen en manen in elke rij en kolom', daily: 'Dagelijkse Puzzle', random: 'Willekeurig Spel' }
            };
            
            document.querySelector('.subtitle').textContent = texts[lang].subtitle;
        }
        
        function startDailyPuzzle() {
            startGame();
        }
        
        function startGame() {
            const generator = new TangoGenerator(6);
            
            let puzzle = null;
            for (let i = 0; i < 30; i++) {
                puzzle = generator.generate();
                if (puzzle) break;
            }
            
            if (!puzzle) {
                alert('Kon geen puzzle genereren');
                return;
            }
            
            game = puzzle;
            grid = puzzle.grid.map(row => [...row]);
            history = [];
            
            renderGrid();
        }
        
        function renderGrid() {
            const gridEl = document.getElementById('tango-grid');
            const size = game.size;
            
            gridEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            gridEl.innerHTML = '';
            
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'tango-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    // Check if this was a fixed cell
                    const wasFixed = game.grid[y][x] !== '';
                    if (wasFixed && game.grid[y][x]) {
                        cell.classList.add('fixed');
                    }
                    
                    cell.textContent = grid[y][x];
                    
                    // Add constraints
                    const constraints = game.constraints.filter(c => 
                        (c.x1 === x && c.y1 === y) || (c.x2 === x && c.y2 === y)
                    );
                    
                    constraints.forEach(c => {
                        if (c.x1 === x && c.y1 === y) {
                            const span = document.createElement('span');
                            span.className = 'constraint right';
                            span.textContent = c.type;
                            cell.appendChild(span);
                        }
                        if (c.x2 === x && c.y2 === y) {
                            const span = document.createElement('span');
                            span.className = 'constraint left';
                            span.textContent = c.type;
                            cell.appendChild(span);
                        }
                    });
                    
                    cell.onclick = () => toggleCell(x, y);
                    gridEl.appendChild(cell);
                }
            }
        }
        
        function toggleCell(x, y) {
            // Can't change fixed cells
            if (game.grid[y][x] !== '') return;
            
            history.push(grid.map(row => [...row]));
            
            if (grid[y][x] === '☀️') {
                grid[y][x] = '🌙';
            } else if (grid[y][x] === '🌙') {
                grid[y][x] = '';
            } else {
                grid[y][x] = '☀️';
            }
            
            document.getElementById('undo-btn').disabled = history.length === 0;
            renderGrid();
            checkWin();
        }
        
        function undoMove() {
            if (history.length === 0) return;
            grid = history.pop();
            document.getElementById('undo-btn').disabled = history.length === 0;
            renderGrid();
        }
        
        function clearBoard() {
            history.push(grid.map(row => [...row]));
            
            // Only clear non-fixed cells
            for (let y = 0; y < game.size; y++) {
                for (let x = 0; x < game.size; x++) {
                    if (game.grid[y][x] === '') {
                        grid[y][x] = '';
                    }
                }
            }
            
            document.getElementById('undo-btn').disabled = false;
            renderGrid();
        }
        
        function checkWin() {
            const generator = new TangoGenerator(6);
            if (generator.checkWin(grid, game)) {
                setTimeout(() => {
                    alert('🎉 Gefeliciteerd! Je hebt gewonnen!');
                }, 100);
            }
        }
        
        function goToDashboard() {
            window.location.href = '../../index.html';
        }
        
        // Initialize
        setLanguage(currentLang);
        startGame();
    </script>
</body>
</html>
