<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queens</title>
    <link rel="stylesheet" href="../../shared/css/style.css">
    <style>
        .queens-container { width: 100%; max-width: 500px; }
        
        .queens-grid-container {
            background: #16213e;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            overflow-x: auto;
        }
        
        .queens-grid {
            display: grid;
            gap: 2px;
            margin: 0 auto;
        }
        
        .queens-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.15s ease;
            position: relative;
        }
        
        .queens-cell.region-0 { background: #2c3e50; }
        .queens-cell.region-1 { background: #34495e; }
        .queens-cell.region-2 { background: #3d566e; }
        .queens-cell.region-3 { background: #4a6572; }
        .queens-cell.region-4 { background: #527175; }
        .queens-cell.region-5 { background: #597779; }
        .queens-cell.region-6 { background: #61837d; }
        .queens-cell.region-7 { background: #698f81; }
        .queens-cell.region-8 { background: #719b85; }
        .queens-cell.region-9 { background: #79a789; }
        
        .queens-cell:hover { filter: brightness(1.2); }
        
        .queens-cell .queen {
            font-size: 28px;
            z-index: 2;
        }
        
        .queens-cell .conflict {
            position: absolute;
            inset: 0;
            background: rgba(231, 76, 60, 0.5);
            z-index: 1;
        }
        
        .queens-cell .attack {
            position: absolute;
            inset: 0;
            background: rgba(231, 76, 60, 0.3);
            z-index: 0;
        }
        
        .queens-cell .marker {
            position: absolute;
            font-size: 18px;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 2px rgba(0,0,0,0.8), 0 0 1px rgba(0,0,0,1);
            z-index: 3;
        }
        
        .tool-btn.active-mode {
            background: #e94560;
            color: white;
            border-color: #e94560;
        }
        
        .difficulty-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #0f3460;
            border-radius: 10px;
            font-size: 16px;
            background: #0f3460;
            color: #fff;
            margin-top: 8px;
        }
        
        .queens-info {
            text-align: center;
            margin: 15px 0;
            color: #888;
        }
        
        .queens-info span {
            color: #e94560;
            font-weight: bold;
        }
        
        @media (max-width: 500px) {
            .queens-cell {
                width: 32px;
                height: 32px;
                font-size: 20px;
            }
            .queens-cell .queen { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="lang-switch">
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn active" onclick="setLanguage('nl')">NL</button>
        </div>
        
        <h1>👑 Queens</h1>
        <p class="subtitle">Plaats een koningin per rij, kolom en kleur</p>
        
        <div class="card">
            <label>
                <span data-i18n="difficulty">Moeilijkheid</span>
                <select class="difficulty-select" id="difficulty" onchange="startGame()">
                    <option value="6">6x6 - Easy</option>
                    <option value="7">7x7 - Medium</option>
                    <option value="8" selected>8x8 - Normal</option>
                    <option value="9">9x9 - Hard</option>
                    <option value="10">10x10 - Expert</option>
                </select>
            </label>
            
            <div class="settings-toggle" style="margin-top: 15px;">
                <span>🤖 Auto-X</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="auto-x-toggle" onchange="toggleAutoX()">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            
            <button class="btn btn-primary" onclick="startDailyPuzzle()" style="margin-top: 15px;">
                🔥 Dagelijkse Puzzle
            </button>
        </div>
        
        <div class="queens-grid-container">
            <div class="queens-grid" id="queens-grid"></div>
        </div>
        
        <div class="queens-info">
            <span id="queens-count">0</span> / <span id="queens-total">8</span> koninginnen
        </div>
        
        <div class="game-tools">
            <button class="tool-btn" onclick="undoMove()" id="undo-btn" disabled>↩ UNDO</button>
            <button class="tool-btn" onclick="clearBoard()">🗑️ CLEAR</button>
            <button class="tool-btn" onclick="showHint()">💡 HINT</button>
        </div>
        
        <button class="btn btn-secondary" onclick="goToDashboard()">← Terug naar Spellen</button>
    </div>

    <script src="js/queens.js"></script>
    <script>
        let game = null;
        let history = [];
        let autoX = false;
        let isDragging = false;
        let dragValue = null;
        let currentLang = localStorage.getItem('games_lang') || 'nl';
        
        const regionColors = [
            '#e74c3c', '#3498db', '#2ecc71', '#f39c12',
            '#9b59b6', '#1abc9c', '#e91e63', '#ff5722',
            '#795548', '#607d8b'
        ];
        
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('games_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === lang);
            });
            
            const texts = {
                en: { subtitle: 'Place one queen per row, column, and color', difficulty: 'Difficulty', daily: 'Daily Puzzle' },
                nl: { subtitle: 'Plaats een koningin per rij, kolom en kleur', difficulty: 'Moeilijkheid', daily: 'Dagelijkse Puzzle' }
            };
            
            document.querySelector('.subtitle').textContent = texts[lang].subtitle;
        }
        
        function startDailyPuzzle() {
            const size = parseInt(document.getElementById('difficulty').value);
            const seed = new Date().toISOString().split('T')[0];
            Math.seedrandom(seed);
            startGame();
        }
        
        function startGame() {
            const size = parseInt(document.getElementById('difficulty').value);
            const generator = new QueensGenerator();
            
            let puzzle = null;
            for (let i = 0; i < 20; i++) {
                puzzle = generator.generate(size);
                if (puzzle) break;
            }
            
            if (!puzzle) {
                alert('Kon geen puzzle genereren');
                return;
            }
            
            game = {
                puzzle: puzzle.puzzle.map(row => [...row]),
                regions: puzzle.regions,
                size: size,
                solution: puzzle.solution
            };
            
            history = [];
            document.getElementById('queens-total').textContent = size;
            updateCount();
            renderGrid();
        }
        
        function renderGrid() {
            const grid = document.getElementById('queens-grid');
            const size = game.size;
            
            grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
            grid.innerHTML = '';
            
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'queens-cell';
                    cell.style.backgroundColor = regionColors[game.regions[y][x] % regionColors.length];
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (game.puzzle[y][x] === 'Q') {
                        cell.innerHTML = '<span class="queen">♛</span>';
                    } else if (game.puzzle[y][x] === 'X') {
                        cell.innerHTML = '<span class="marker">✕</span>';
                    }
                    
                    // Click & drag events
                    cell.onmousedown = (e) => {
                        e.preventDefault();
                        startDrag(x, y);
                    };
                    cell.onmouseenter = (e) => {
                        if (isDragging) continueDrag(x, y);
                    };
                    cell.onclick = (e) => {
                        if (!isDragging) toggleQueen(x, y);
                    };
                    
                    // Touch events
                    cell.ontouchstart = (e) => {
                        e.preventDefault();
                        startDrag(x, y);
                    };
                    cell.ontouchmove = (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const target = document.elementFromPoint(touch.clientX, touch.clientY);
                        if (target && target.classList.contains('queens-cell')) {
                            const tx = parseInt(target.dataset.x);
                            const ty = parseInt(target.dataset.y);
                            continueDrag(tx, ty);
                        }
                    };
                    cell.ontouchend = endDrag;
                    
                    grid.appendChild(cell);
                }
            }
            
            // Global mouse/touch up
            document.onmouseup = endDrag;
            document.ontouchend = endDrag;
        }
        
        function startDrag(x, y) {
            isDragging = true;
            const current = game.puzzle[y][x];
            
            // Determine drag value based on current state
            if (current === 'Q') dragValue = null;
            else if (current === 'X') dragValue = 'Q';
            else dragValue = 'X';
            
            // Save history on first cell
            history.push(game.puzzle.map(row => [...row]));
            toggleCell(x, y, dragValue);
            
            document.getElementById('undo-btn').disabled = history.length === 0;
            updateCount();
            renderGrid();
            checkWin();
        }
        
        function continueDrag(x, y) {
            if (!isDragging) return;
            
            const current = game.puzzle[y][x];
            
            // Only toggle if different from drag value
            if (current !== dragValue) {
                toggleCell(x, y, dragValue);
                updateCount();
                renderGrid();
                checkWin();
            }
        }
        
        function endDrag() {
            isDragging = false;
            dragValue = null;
        }
        
        function toggleCell(x, y, forceValue = null) {
            const current = game.puzzle[y][x];
            
            // Determine next value
            let next;
            if (forceValue !== null) {
                next = forceValue;
            } else {
                if (current === null || current === undefined) next = 'X';
                else if (current === 'X') next = 'Q';
                else next = null;
            }
            
            game.puzzle[y][x] = next;
            
            // Apply auto-X if enabled and queen placed
            if (autoX && next === 'Q') {
                applyAutoX(x, y);
            }
        }
        
        function applyAutoX(queenX, queenY) {
            const size = game.size;
            const regions = game.regions;
            
            // Mark all cells attacked by this queen
            for (let x = 0; x < size; x++) {
                if (x !== queenX && game.puzzle[queenY][x] === null) {
                    game.puzzle[queenY][x] = 'X';
                }
            }
            for (let y = 0; y < size; y++) {
                if (y !== queenY && game.puzzle[y][queenX] === null) {
                    game.puzzle[y][queenX] = 'X';
                }
            }
            // Diagonals
            for (let d = -size; d < size; d++) {
                const dx = d;
                const dy = d;
                const nx = queenX + dx;
                const ny = queenY + dy;
                if (nx >= 0 && nx < size && ny >= 0 && ny < size && game.puzzle[ny][nx] === null) {
                    game.puzzle[ny][nx] = 'X';
                }
            }
            for (let d = -size; d < size; d++) {
                const dx = d;
                const dy = -d;
                const nx = queenX + dx;
                const ny = queenY + dy;
                if (nx >= 0 && nx < size && ny >= 0 && ny < size && game.puzzle[ny][nx] === null) {
                    game.puzzle[ny][nx] = 'X';
                }
            }
        }
        
        function toggleQueen(x, y) {
            history.push(game.puzzle.map(row => [...row]));
            toggleCell(x, y);
            
            document.getElementById('undo-btn').disabled = history.length === 0;
            updateCount();
            renderGrid();
            checkWin();
        }
        
        function toggleMarkerMode() {
            // No longer needed - 3-state click handles this
        }
        
        function toggleAutoX() {
            autoX = document.getElementById('auto-x-toggle').checked;
            localStorage.setItem('queens_autox', autoX);
            renderGrid();
        }
        
        function updateCount() {
            let count = 0;
            for (let y = 0; y < game.size; y++) {
                for (let x = 0; x < game.size; x++) {
                    if (game.puzzle[y][x] === 'Q') count++;
                }
            }
            document.getElementById('queens-count').textContent = count;
        }
        
        function undoMove() {
            if (history.length === 0) return;
            game.puzzle = history.pop();
            document.getElementById('undo-btn').disabled = history.length === 0;
            updateCount();
            renderGrid();
        }
        
        function clearBoard() {
            history.push(game.puzzle.map(row => [...row]));
            game.puzzle = game.puzzle.map(row => row.map(() => null));
            document.getElementById('undo-btn').disabled = false;
            updateCount();
            renderGrid();
        }
        
        function showHint() {
            // Find first empty region and show where queen should go
            for (let y = 0; y < game.size; y++) {
                for (let x = 0; x < game.size; x++) {
                    if (game.solution[y][x] === 'Q' && game.puzzle[y][x] !== 'Q') {
                        game.puzzle[y][x] = 'Q';
                        updateCount();
                        renderGrid();
                        checkWin();
                        return;
                    }
                }
            }
        }
        
        function checkWin() {
            const generator = new QueensGenerator();
            if (generator.checkWin(game.puzzle, game.regions)) {
                setTimeout(() => {
                    alert('🎉 Gefeliciteerd! Je hebt gewonnen!');
                }, 100);
            }
        }
        
        function goToDashboard() {
            window.location.href = '../../index.html';
        }
        
        // Initialize
        setLanguage(currentLang);
        
        // Load auto-X setting
        autoX = localStorage.getItem('queens_autox') === 'true';
        document.getElementById('auto-x-toggle').checked = autoX;
        
        startGame();
    </script>
</body>
</html>
